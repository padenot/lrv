name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: Install jj (Linux)
        if: runner.os == 'Linux'
        env:
          JJ_VERSION: v0.46.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/jj-vcs/jj/releases/download/$JJ_VERSION/jj-$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install jj (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JJ_VERSION: v0.46.0
        run: |
          $dir = "$env:RUNNER_TEMP\jj"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/jj-vcs/jj/releases/download/$env:JJ_VERSION/jj-$env:JJ_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$dir\jj.zip"
          Expand-Archive "$dir\jj.zip" -DestinationPath $dir
          Add-Content $env:GITHUB_PATH $dir

      - name: Install root web dependencies
        run: npm ci

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Run repo checks
        run: just ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: Install root web dependencies
        run: npm ci

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
        working-directory: e2e

      - name: Run Playwright e2e
        run: just ci-e2e

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7

