name: Publish crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify authentication and package without uploading
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if os.environ['DRY_RUN'] != 'true':
              expected = f'v{version}'
              if os.environ['RELEASE_REF_TYPE'] != 'tag' or os.environ['RELEASE_REF'] != expected:
                  raise SystemExit(f'Publishing requires the {expected} tag')
          PYTHON
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:web
      - run: node scripts/check-package-assets.mjs
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          dry_run = os.environ['DRY_RUN'] == 'true'
          if not dry_run:
              request = urllib.request.Request(
                  f'https://crates.io/api/v1/crates/lrv/{version}',
                  headers={'User-Agent': 'lrv release workflow'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      published = json.load(response)['version']
                  if published['yanked']:
                      raise SystemExit(f'lrv {version} is yanked; refusing to skip it')
                  print(f'lrv {version} is already published; skipping', flush=True)
                  raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          command = ['cargo', 'publish', '--locked']
          if dry_run:
              command.append('--dry-run')
          subprocess.run(command, check=True)
          PYTHON
